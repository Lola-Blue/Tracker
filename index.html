<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="./assets/icon/icon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Relief&display=swap" rel="stylesheet">
<title>Lola Blue Tracker</title>
<style>
:root {
  --bg: #080808;
  --panel: #101010;
  --panel-2: #171717;
  --border: #292929;
  --text: #f4f4f4;
  --muted: #8e8e8e;
  --accent: #aebed0;
  --yellow: #f4c936;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: url("./assets/bg/bg.gif");
  background-repeat: repeat;
background-size: cover;
  background-attachment: fixed;
  color: var(--text);
  font-family: 'Lato', sans-serif;
}
.app { max-width: 1280px; margin: auto; padding: 28px 28px 60px; }
.topbar {
  display: flex; align-items: center; gap: 18px; margin-bottom: 28px;
}
.brand { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.global-search {
  flex: 1; background: #111; border: 1px solid #242424; border-radius: 14px;
  padding: 14px 18px; color: white; outline: none; font-size: 14px;
}
.icon-btn, .load-btn {
  border: 1px solid #292929; border-radius: 12px;
  padding: 12px 15px; cursor: pointer;
}
.load-btn { background: #fff; color: #111; font-weight: 700; }
.hero {display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
.avatar {
  #lola-img {
    width: 72px; height: 72px; border-radius: 18px; object-fit: cover;
    background: linear-gradient(135deg, #d7c8b5, #555);
  }
}
.artist h1 { margin: 0; font-size: 28px; }
.artist p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 30px; }
.tab {
  border: 1px solid #292929; background: #111; color: #aaa; border-radius: 999px;
  padding: 10px 15px; cursor: pointer; font-weight: 650; font-size: 13px;
}
.tab.active { background: #fff; color: #111; border-color: #fff; }
.controls { display: flex; gap: 12px; margin-bottom: 14px; }
.track-search {
  flex: 1; background: #111; border: 1px solid #242424; border-radius: 13px;
  color: white; padding: 15px; outline: none;
}
select {
  background: #111; color: #bbb; border: 1px solid #292929; border-radius: 13px;
  padding: 0 14px;
}
.stats { color: #777; font-size: 13px; margin: 20px 0 14px; }
.release {
  border: 1px solid #343f48; background: #0f1c27; border-radius: 17px;
  margin-bottom: 20px; overflow: hidden;
}
.release:nth-child(even) { background: #1d1808; border-color: #3e351a; }
.release-header {
  display: flex; align-items: center; gap: 16px; padding: 20px;
  cursor: pointer;
}
.cover {
  width: 56px;
  height: 56px;
  border-radius: 12px;
  object-fit: cover;
  overflow: hidden;
}

.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.release-info { flex: 1; }
.release-title { font-size: 18px; font-weight: 800; }
.release-meta { color: #8e969c; font-size: 13px; margin-top: 4px; }
.chevron { color: #777; font-size: 20px; }
.release-description {
  margin: 0 20px 18px; padding: 15px; border-radius: 12px;
  background: rgba(0,0,0,.22); color: #929292; font-size: 13px;
}
.release.pink {
  background: rgba(66, 73, 117);
  border-color: #402e38;
}
.release.ep {
  background: rgba(61, 67, 56);
  border-color: #402e38;
}
.tracks { padding: 0 20px 20px; }
.track {
  display: flex; align-items: center; gap: 14px; padding: 14px 12px;
  border: 1px solid rgba(255,255,255,.08); background: rgba(0,0,0,.18);
  border-radius: 13px; margin-top: 9px;
}
.play {
  width: 38px; height: 38px; border: 0; border-radius: 50%; background: white;
  color: black; cursor: pointer; font-size: 15px;
}
.play.released {
  background: var(--yellow);
  color: #111;
}
.track-main { flex: 1; min-width: 0; }
.track-name { font-weight: 750; }
.track-sub { color: #7f7f7f; font-size: 12px; margin-top: 4px; }
.track-description {
  color: #a0a0a0;
  font-size: 12px;
  line-height: 1.4;
  margin-top: 7px;
}
.badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.badge {
  font-size: 11px; color: #aaa; border: 1px solid #3b3b3b; border-radius: 7px;
  padding: 5px 8px; background: rgba(255,255,255,.04);
}
.star { color: var(--yellow); margin-right: 4px; }
.actions { color: #888; font-size: 18px; cursor: pointer; }
.hidden { display: none; }
@media(max-width: 760px) {
  .app { padding: 18px 12px 40px; }
  .topbar { flex-wrap: wrap; }
  .brand { width: 100%; }
  .global-search { order: 3; flex-basis: 100%; }
  .controls { flex-direction: column; }
  select { height: 48px; }
  .track { align-items: flex-start; }
  .badges { display: none; }
}
</style>

<div class="app">
  <div class="topbar">
    <div hidden class="brand">LolaTracker</div>
    <input hidden id="globalSearch" class="global-search" placeholder="Search for a song, album, demo, era...">
    <button hidden class="icon-btn">↗</button>
    <button hidden class="icon-btn">⚙</button>
    <button hidden class="load-btn" onclick="alert('idk why imported ts, spaguetti code supremacy')">Load</button>
  </div>

  <section class="hero">
    <div class="avatar"><img src="lola-icon.jpg" alt="LB" id="lola-img"></div>
    <div class="artist">
      <h1>Lola Blue</h1>
      <p>Front-end and box layouts completely derived from artistgrid.cx. Tracker made by <i>larpkfc</i> (discord).<br>©️ All rights reserved to Lola Blue</p>
    </div>
  </section>

  <div class="tabs">
    <button class="tab active" data-filter="all">🎵 All</button>
    <button class="tab" data-filter="unreleased">⏱ Unreleased</button>
    <button class="tab" data-filter="released">💿 Released</button>
    <button class="tab" data-filter="demo">✨ Demos</button>
    <button class="tab" data-filter="cover">🎙 Covers</button>
    <button hidden class="tab" data-filter="favorite">⭐ Favourites</button>
    <button hidden class="tab" data-filter="archive">🗃 Archive</button>
  </div>

  <div class="controls">
    <input id="trackSearch" class="track-search" placeholder="🔍  Search tracks...">
    <select id="sort">
      <option value="default">Sort: Default</option>
      <option value="az">A → Z</option>
      <option value="za">Z → A</option>
    </select>
  </div>

  <div class="stats"><span id="count">0</span> tracks · <span id="playable">0</span> playable</div>
  <main id="releases"></main>
</div>

const releasesEl = document.getElementById("releases");
const trackSearch = document.getElementById("trackSearch");
const globalSearch = document.getElementById("globalSearch");
const countEl = document.getElementById("count");
const playableEl = document.getElementById("playable");
let activeFilter = "all";

function render() {
  const q = (trackSearch.value + " " + globalSearch.value).toLowerCase().trim();
  const sort = document.getElementById("sort").value;
  let total = 0, playable = 0;

  releasesEl.innerHTML = releases.map((release, ri) => {
    let tracks = release.tracks.filter(t => {
      const filterOk = activeFilter === "all" || t.type === activeFilter || (activeFilter === "favorite" && t.favorite);
      const searchOk = !q || (t.name + " " + t.tags.join(" ") + " " + release.title).toLowerCase().includes(q);
      return filterOk && searchOk;
    });

    if (sort === "az") tracks.sort((a,b)=>a.name.localeCompare(b.name));
    if (sort === "za") tracks.sort((a,b)=>b.name.localeCompare(a.name));
    total += tracks.length;
    playable += tracks.length;

    if (!tracks.length) return "";

    return `<section class="release ${release.color}">
      <div class="release-header" onclick="toggleRelease(${ri})">
      <div class="cover">
        <img src="${release.image}" alt="${release.title}">
      </div>
        <div class="release-info">
          <div class="release-title">${release.title}</div>
          <div class="release-meta">${release.meta}</div>
        </div>
        <div class="chevron" id="chevron-${ri}">⌃</div>
      </div>
      <div class="release-description">${release.description}</div>
      <div class="tracks" id="tracks-${ri}">
        ${tracks.map((t, ti) => `<div class="track">
          <button class="play ${t.type === "released" ? "released" : ""}" onclick="playTrack(event, '${t.link}')">▶</button>
          <div class="track-main">
          <div class="track-name">${t.favorite ? '<span hidden class="star">★</span>' : ''}${t.name}</div>
          <div class="track-sub">${t.type} · Lola Blue</div>
          <div class="track-description">${t.description || ""}</div>
        </div>
          <div class="badges">${t.tags.map(x=>`<span class="badge">${x}</span>`).join("")}</div>
          <div hidden class="actions">♡</div>
          <div hidden class="actions">⋯</div>
        </div>`).join("")}
      </div>
    </section>`;
  }).join("");

  countEl.textContent = total;
  playableEl.textContent = playable;
}

function toggleRelease(i) {
  const tracks = document.getElementById("tracks-" + i);
  const chevron = document.getElementById("chevron-" + i);
  tracks.classList.toggle("hidden");
  chevron.textContent = tracks.classList.contains("hidden") ? "⌄" : "⌃";
}

function playTrack(e, link) {
  e.stopPropagation();
  window.open(link, "_blank");
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeFilter = tab.dataset.filter;
    render();
  });
});
trackSearch.addEventListener("input", render);
globalSearch.addEventListener("input", render);
document.getElementById("sort").addEventListener("change", render);
render();
</script>
